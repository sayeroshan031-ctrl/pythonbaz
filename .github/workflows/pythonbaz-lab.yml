name: PythonBaz lab validation

on:
  push:
    branches:
      - feat/pythonbaz-lab-v3
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check worker
        run: node --check pyodide-worker.js
      - name: Run static tests
        run: node --test tests/*.test.mjs
